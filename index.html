
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXZORA AVIATOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{text-align:center;padding:20px;background:#190808;border-bottom:1px solid #e32636}
.logo{font-size:27px;color:#ff303d;font-weight:900;letter-spacing:3px}
main{max-width:520px;margin:auto;padding:15px}
.panel{background:#191919;border:1px solid #393939;border-radius:13px;padding:17px;margin-bottom:15px}
input{width:100%;padding:14px;margin:8px 0;background:#090909;border:1px solid #555;border-radius:8px;color:white}
button{padding:13px;border:0;border-radius:8px;background:#e32636;color:white;font-weight:bold;width:100%;margin:5px 0}
button:disabled{opacity:.5}
.secondary{background:#333}
#game{display:none}
.balance{color:#ffd45c;font-size:23px;font-weight:bold}
.game{height:260px;background:radial-gradient(ellipse at bottom,#50100e,#100808);border-radius:12px;position:relative;overflow:hidden}
#multiplier{position:absolute;top:40%;width:100%;text-align:center;font-size:45px;font-weight:bold}
#plane{position:absolute;bottom:35px;left:10%;font-size:40px}
#status{text-align:center;padding:12px;color:#ff9999}
.history span{display:inline-block;background:#333;padding:8px;margin:4px;border-radius:15px}
footer{text-align:center;color:#888;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">NEXZORA</div>
<small>AVIATOR • FREE DEMO</small>
</header>

<main>
<section id="auth" class="panel">
<h2>Player Login</h2>
<input id="email" type="email" placeholder="Enter email">
<input id="password" type="password" placeholder="Enter password">
<button onclick="register()">CREATE ACCOUNT</button>
<button class="secondary" onclick="login()">LOGIN</button>
<p id="authMessage">Create your demo player account.</p>
</section>

<section id="game">
<div class="panel">
Welcome, <b id="playerEmail"></b>
<button class="secondary" onclick="logout()">LOG OUT</button>
Demo Coin Balance:
<div class="balance" id="coins">10,000</div>
</div>

<div class="game">
<div id="status">READY TO PLAY</div>
<div id="multiplier">1.00x</div>
<div id="plane">✈️</div>
</div>

<div class="panel">
<label>Demo bet amount</label>
<input id="amount" type="number" value="100" min="1" max="1000">
<button id="play" onclick="startGame()">BET / PLAY</button>
<button id="cash" onclick="cashOut()" disabled style="background:#168b4b">CASH OUT</button>
<p id="message">Practice only. No real money.</p>
</div>

<div class="panel">
<b>RECENT DEMO RESULTS</b>
<div class="history" id="history">No games yet</div>
</div>
</section>
</main>

<footer>
NEXZORA AVIATOR • DEMO ONLY<br>
No deposits, withdrawals or cash prizes.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyAbf-PvbO77CBt-1Mi6h0kFtNPyJb86E-w",
 authDomain: "nexzora-aviator.firebaseapp.com",
 projectId: "nexzora-aviator",
 storageBucket: "nexzora-aviator.firebasestorage.app",
 messagingSenderId: "535194392375",
 appId: "1:535194392375:web:630926e2c6c32ba83b6cb2",
 measurementId: "G-CDYGJGX75N"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

function register(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email||password.length<6){
  authMessage.textContent="Enter email and password (minimum 6 characters).";
  return;
 }
 auth.createUserWithEmailAndPassword(email,password)
 .catch(e=>authMessage.textContent=e.message);
}

function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 auth.signInWithEmailAndPassword(email,password)
 .catch(e=>authMessage.textContent=e.message);
}

function logout(){auth.signOut();}

auth.onAuthStateChanged(user=>{
 auth.style.display=user?'none':'block';
 document.getElementById('game').style.display=user?'block':'none';
 if(user)playerEmail.textContent=user.email;
});

let coins=10000,active=false,cashed=false,m=1,timer;

function startGame(){
 if(active)return;
 const amount=Number(document.getElementById('amount').value);
 if(!Number.isInteger(amount)||amount<1||amount>1000||amount>coins){
  message.textContent="Invalid demo coin amount";return;
 }
 coins-=amount;
 document.getElementById('coins').textContent=coins.toLocaleString();
 active=true;cashed=false;m=1;
 play.disabled=true;cash.disabled=false;
 status.textContent="PLANE FLYING";
 message.textContent="Demo bet: "+amount+" coins";
 plane.style.transform="translate(0,0)";
 const crashAt=1.5+Math.random()*5;
 timer=setInterval(()=>{
  m+=.03;
  multiplier.textContent=m.toFixed(2)+"x";
  plane.style.transform=`translate(${Math.min(m*24,300)}px,${-Math.min(m*18,160)}px)`;
  if(m>=crashAt){
   clearInterval(timer);active=false;
   status.textContent="ROUND CRASHED";
   message.textContent=cashed?"Demo cash out successful.":"Demo bet lost.";
   cash.disabled=true;play.disabled=false;
   addHistory(m.toFixed(2)+"x");
  }
 },100);
}

function cashOut(){
 if(!active||cashed)return;
 cashed=true;
 const amount=Number(document.getElementById('amount').value);
 const win=Math.floor(amount*m);
 coins+=win;
 document.getElementById('coins').textContent=coins.toLocaleString();
 message.textContent="Demo cash out at "+m.toFixed(2)+"x. Won "+win+" coins.";
 cash.disabled=true;
}

function addHistory(value){
 if(history.textContent==="No games yet")history.textContent="";
 const item=document.createElement("span");
 item.textContent=value;
 history.prepend(item);
}
</script>
</body>
  </html>
