
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXZORA AVIATOR</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{
 padding:20px;background:#111;
 border-bottom:1px solid #a90000;
}
.logo{font-size:27px;font-weight:900;color:#ff2020;letter-spacing:2px}
.logo span{color:white}
.small{color:#aaa;font-size:12px;margin-top:5px}
.container{max-width:480px;margin:auto;padding:15px}
.panel{
 background:#151515;border:1px solid #333;
 border-radius:14px;padding:18px;margin:14px 0;
}
h2{color:#ff2525;margin-top:5px}
input{
 width:100%;padding:14px;margin:7px 0;
 background:#080808;border:1px solid #444;
 border-radius:8px;color:white;font-size:16px;
}
button{
 width:100%;padding:14px;margin:6px 0;
 border:0;border-radius:8px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.red{background:#d60000;color:white}
.dark{background:#292929;color:white}
.green{background:#176b36;color:white}
button:disabled{opacity:.45}
#message{color:#ff7777;font-size:14px;min-height:20px}
#game{
 height:230px;background:
 radial-gradient(circle at center,#301010,#090909 70%);
 border:1px solid #5b1717;border-radius:12px;
 position:relative;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
}
#multiplier{font-size:43px;font-weight:bold;color:#ff2929}
#plane{
 position:absolute;left:15px;bottom:15px;
 font-size:35px;display:none;
}
#status{color:#aaa;margin:10px}
.balance{font-size:26px;color:#ff3030;font-weight:bold}
.history-item{
 display:inline-block;background:#292929;
 padding:9px 12px;border-radius:7px;margin:4px;
 color:#ff5555;font-weight:bold;
}
.note{font-size:11px;color:#888;line-height:1.5}
</style>
</head>

<body>

<header>
 <div class="logo">NEXZORA <span>AVIATOR</span></div>
 <div class="small">FREE DEMO GAME</div>
</header>

<div class="container">

<!-- LOGIN -->
<div class="panel" id="auth">
 <h2>PLAYER LOGIN</h2>
 <input id="email" type="email" placeholder="Enter Email">
 <input id="password" type="password" placeholder="Enter Password">
 <button class="red" id="loginBtn">LOGIN</button>
 <button class="dark" id="registerBtn">CREATE ACCOUNT</button>
 <div id="message"></div>
</div>

<!-- GAME -->
<div id="gameArea" style="display:none">

 <div class="panel">
  <div id="playerEmail" class="small"></div>
  <button class="dark" id="logoutBtn">LOGOUT</button>
  <div class="small">YOUR DEMO BALANCE</div>
  <div class="balance" id="balance">10,000</div>
 </div>

 <div id="game">
  <div>
   <div id="multiplier">1.00x</div>
   <div id="status">READY TO PLAY</div>
  </div>
  <div id="plane">✈️</div>
 </div>

 <div class="panel">
  <input id="betAmount" type="number" min="10"
   step="10" value="100" placeholder="Demo Bet Amount">

  <button class="red" id="playBtn">START GAME</button>
  <button class="green" id="cashBtn" disabled>DEMO CASH OUT</button>
 </div>

 <div class="panel">
  <h2>RECENT RESULTS</h2>
  <div id="history">No games yet</div>
 </div>

 <div class="panel">
  <div class="note">
   NEXZORA AVIATOR is a free-to-play demonstration.
   Coins are virtual only and have no cash value.
   No deposits, withdrawals or real-money prizes.
  </div>
 </div>

</div>
</div>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyAbf-PvbO77CBt-1Mi6h0kFtNPyJb86E-w",
 authDomain: "nexzora-aviator.firebaseapp.com",
 projectId: "nexzora-aviator",
 storageBucket: "nexzora-aviator.firebasestorage.app",
 messagingSenderId: "535194392375",
 appId: "1:535194392375:web:630926e2c6c32ba83b6cb2",
 measurementId: "G-CDYGJGX75N"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const $ = id => document.getElementById(id);

let balance = 10000;
let currentMultiplier = 1;
let crashPoint = 0;
let gameRunning = false;
let gameTimer = null;
let historyList = [];

function showMessage(text){
 $("message").textContent = text;
}

function updateBalance(){
 $("balance").textContent = balance.toLocaleString("en-IN");
}

function showHistory(value){
 historyList.unshift(value.toFixed(2) + "x");
 historyList = historyList.slice(0,8);
 $("history").innerHTML = "";
 historyList.forEach(item=>{
  const span = document.createElement("span");
  span.className = "history-item";
  span.textContent = item;
  $("history").appendChild(span);
 });
}

$("registerBtn").addEventListener("click", async ()=>{
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || password.length < 6){
  showMessage("Email aur kam se kam 6 character password dalo.");
  return;
 }

 try{
  await auth.createUserWithEmailAndPassword(email,password);
  showMessage("Account created successfully!");
 }catch(error){
  showMessage(error.message);
 }
});

$("loginBtn").addEventListener("click", async ()=>{
 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || !password){
  showMessage("Email aur password dalo.");
  return;
 }

 try{
  await auth.signInWithEmailAndPassword(email,password);
 }catch(error){
  showMessage(error.message);
 }
});

$("logoutBtn").addEventListener("click", async ()=>{
 stopGame();
 await auth.signOut();
});

auth.onAuthStateChanged(user=>{
 if(user){
  $("auth").style.display = "none";
  $("gameArea").style.display = "block";
  $("playerEmail").textContent = user.email || "Player";
  balance = 10000;
  updateBalance();
 }else{
  $("auth").style.display = "block";
  $("gameArea").style.display = "none";
  showMessage("");
  stopGame();
 }
});

function stopGame(){
 clearInterval(gameTimer);
 gameRunning = false;
 $("playBtn").disabled = false;
 $("cashBtn").disabled = true;
 $("plane").style.display = "none";
}

function startGame(){
 if(gameRunning) return;

 const bet = Number($("betAmount").value);

 if(!Number.isFinite(bet) || bet < 10){
  $("status").textContent = "Minimum demo bet is 10 coins";
  return;
 }

 if(bet > balance){
  $("status").textContent = "Not enough demo coins";
  return;
 }

 balance -= bet;
 updateBalance();

 gameRunning = true;
 currentMultiplier = 1;
 crashPoint = Number((1.05 + Math.random()*5.95).toFixed(2));

 $("multiplier").textContent = "1.00x";
 $("status").textContent = "FLYING...";
 $("plane").style.display = "block";
 $("playBtn").disabled = true;
 $("cashBtn").disabled = false;

 const startTime = Date.now();

 gameTimer = setInterval(()=>{
  const elapsed = (Date.now()-startTime)/1000;
  currentMultiplier = 1 + elapsed*0.35 + elapsed*elapsed*0.035;

  $("multiplier").textContent = currentMultiplier.toFixed(2)+"x";
  $("plane").style.left = Math.min(78,15+elapsed*8)+"%";
  $("plane").style.bottom = Math.min(75,15+elapsed*5)+"%";

  if(currentMultiplier >= crashPoint){
   crashGame();
  }
 },100);
}

function crashGame(){
 if(!gameRunning) return;

 clearInterval(gameTimer);
 gameRunning = false;

 $("multiplier").textContent = crashPoint.toFixed(2)+"x";
 $("status").textContent = "CRASHED!";
 $("cashBtn").disabled = true;
 $("playBtn").disabled = false;

 showHistory(crashPoint);
}

function cashOut(){
 if(!gameRunning) return;

 clearInterval(gameTimer);
 gameRunning = false;

 const bet = Number($("betAmount").value);
 const winnings = Math.floor(bet*currentMultiplier);

 balance += winnings;
 updateBalance();

 $("status").textContent =
  "DEMO CASH OUT: +" + winnings.toLocaleString("en-IN") + " coins";

 $("cashBtn").disabled = true;
 $("playBtn").disabled = false;

 showHistory(currentMultiplier);
}

$("playBtn").addEventListener("click",startGame);
$("cashBtn").addEventListener("click",cashOut);
</script>

</body>
 </html>
